<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Yönlendiriliyor… | Hello Kido</title>
    <script>
      // GitHub Pages + HashRouter yönlendirmesi.
      //
      // Instagram gibi platformlar bio bağlantısındaki '#' karakterini '%23'
      // olarak kodlayabiliyor. Bu durumda tarayıcı '#/takvim' yerine gerçek bir
      // dosya yolu olan '/%23/takvim' adresini ister; GitHub Pages böyle bir
      // dosya bulamaz ve bu 404.html dosyasını çalıştırır.
      //
      // Burada '%23' işaretini yakalayıp doğru hash adresine geri yönlendiriyoruz:
      //   /hellokido/%23/takvim  ->  /hellokido/#/takvim
      (function () {
        var loc = window.location;
        // Sitenin yayınlandığı yol. vite.config.js içindeki 'base' ile AYNI olmalıdır
        // (bu dosya derlemeden geçmediği için oradan okunamaz).
        var base = '/hellokido/';

        // Herkese açık takvim bağlantısı hangi biçimde bozulmuş olursa olsun (hash düşmüş:
        // /hellokido/takvim, çift kodlanmış: %2523/takvim, sonuna/önüne izleme parametresi
        // eklenmiş...) veliyi yönetici giriş ekranına değil takvime götür.
        // Yönetim rotalarının hiçbirinde "takvim" geçmez, bu yüzden karışmaz.
        var full = loc.pathname + loc.search + loc.hash;
        if (/takvim/i.test(full)) {
          loc.replace(loc.origin + base + '#/takvim');
          return;
        }

        // Kodlanmış '#' (yani %23) işaretinden sonrası asıl gitmek istenen rotadır.
        var idx = loc.href.indexOf('%23');

        if (idx !== -1) {
          var route = loc.href.substring(idx + 3); // '%23' (3 karakter) sonrası, ör. "/calendar"
          if (route.charAt(0) !== '/') route = '/' + route;
          loc.replace(loc.origin + base + '#' + route);
          return;
        }

        // '%23' yoksa bilinmeyen bir yol demektir; uygulamanın ana sayfasına gönder.
        loc.replace(loc.origin + base + '#/');
      })();
    </script>
  </head>
  <body>
    <p>
      Yönlendiriliyorsunuz… Otomatik yönlenmezseniz
      <a id="fallback-link" href="/hellokido/#/takvim">buraya tıklayın</a>.
    </p>
  </body>
</html>
